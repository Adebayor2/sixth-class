<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Todo Application</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@6.0.0-alpha.1/dist/css/bootstrap.min.css" rel="stylesheet" integrity="sha384-B/GM4XqrwHnWXNOWMbloTmrYXZg10cakYGmpfsR/bbzQ6JAJI4ihuyADKLnBgrCe" crossorigin="anonymous">
</head>
<body class="bg-secondary-subtle min-vh-100 d-flex justify-content-center align-items-center px-4 py-5">
    <div class="container">
        <div class="row justify-content-center g-4 ">
            <div class="col-12 col-sm-10 col-md-8 col-lg-6">
                <div class="card border-0 shadow-lg rounded-4 overflow-hidden bg-secondary">
                    <div class="card-body p-10 p-md-5 text-center text-dark">
                        <h1 class="display-6 fw-bold mb-2 text-dark">Todo List</h1>
                        <p class="mb-4 text-dark">Using Array Methods</p>

                        <div class="d-flex flex-column gap-3 align-items-center">
                            <input type="text" class="form-control form-control-lg rounded-3 border-0 shadow-sm w-100" id="input" placeholder="Add a task...">
                            <button onclick="add()" id="addBtn" class="btn theme-primary btn-solid btn-styled btn-md w-50 text-center rounded-3 fw-semibold text-dark border-0 shadow-sm">Add to List</button>
                        </div>

                        <div id="show" class="mt-4 d-flex flex-column gap-2 text-start fw-semibold text-dark"></div>
                    </div>
                </div>
            </div>
        </div>
    </div>
</body>
<script src="script.js"></script>
<script type="module" src="https://cdn.jsdelivr.net/npm/bootstrap@6.0.0-alpha.1/dist/js/bootstrap.bundle.min.js" integrity="sha384-1a/pXj49ZQ1aHEmrJ+gMw1otqoVsYwlEnlD8mIfY2TV03r20Y0CN7uqx1tQogjPL" crossorigin="anonymous"></script>
</html>
